[package]
name = "arach"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["reference-driver"]
reference-driver = []
kernel-bin = []

[dependencies]
aether = { path = "core/aether" }
abyss = { path = "core/abyss" }
blacklab = { path = "core/blacklab" }
kairos = { path = "core/kairos" }
sisyphus-driver-abi = { path = "libraries/driver-abi" }
slope = { path = "libraries/slope" }
libm = "0.2.16"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arach"
path = "src/main.rs"
required-features = ["kernel-bin"]
test = false
bench = false

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "core/*",
    "libraries/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
