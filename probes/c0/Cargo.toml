[workspace]

[package]
name = "arach-c0-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false
build = "build.rs"

[dependencies]
slope = { git = "https://github.com/SisyphusAeolides/Slope.git", rev = "b3decb53e71bb3c5d5fc55047451bcf9cef7eff9" }

[[bin]]
name = "arach-c0-probe"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
