name: Arach validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-c-fortran:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt,rust-src
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets
      - run: scripts/test-runtime-linker-graph.sh
      - name: Reject generated build products
        run: test -z "$(git ls-files | grep -E '(^target/|\.(o|a|rlib|rmeta)$)' || true)"

  idris-agda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential chezscheme libgmp-dev xz-utils
      - uses: actions/cache@v4
        with:
          path: target/formal/toolchains
          key: arach-formal-idris2-0.8.0-agda-2.8.0-v1
      - run: scripts/bootstrap-formal-toolchains.sh

  arach-kernel-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential gfortran grub-common
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rust-src
      - name: Build the custom kernel contract
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/arach-kernel-contract" \
          ARACH_RUSTD_IMAGE=/bin/true \
          ARACH_RESOLVED_IMAGE=/bin/true \
          ARACH_BOOTSTRAP_IMAGE=/bin/true \
          ARACH_BOOTSTRAP_ABI=linux \
            cargo build --locked --release -p arach --bin arach \
              --no-default-features \
              --features kernel-bin,reference-driver,fortran-control \
              --target x86_64-arach.json -Z json-target-spec \
              -Z build-std=core,alloc,compiler_builtins \
              -Z build-std-features=compiler-builtins-mem
      - name: Verify the Multiboot2 image
        run: grub-file --is-x86-multiboot2 "$RUNNER_TEMP/arach-kernel-contract/x86_64-arach/release/arach"
      - run: git diff --check

  nvidia-source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 452cec62d827034798072827d3866d1881662b77
          path: target/nvidia-open
          fetch-depth: 1
      - run: scripts/audit-nvidia-source.sh target/nvidia-open
      - run: git diff --check && git diff --exit-code
