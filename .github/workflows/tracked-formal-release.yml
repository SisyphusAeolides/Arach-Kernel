name: Tracked formal attestation release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt
      - name: Bind builds to tracked formal attestation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.rs")
          text = path.read_text(encoding="utf-8")
          old_path = 'let path = workspace.join("target/formal/verified.lock");'
          new_path = 'let path = workspace.join("formal/verified.lock");'
          old_message = 'run scripts/check-formal-models.sh before cargo kernel'
          new_message = 'the tracked formal release attestation is missing'
          if text.count(old_path) != 1 or text.count(old_message) != 1:
              raise SystemExit("unexpected formal attestation build contract")
          text = text.replace(old_path, new_path).replace(old_message, new_message)
          path.write_text(text, encoding="utf-8")
          PY
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: git diff --check
      - name: Publish validated build contract
        run: |
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add build.rs
          git commit -m "Bind builds to tracked formal attestation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
