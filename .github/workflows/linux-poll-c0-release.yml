name: Linux poll C0 release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SisyphusAeolides/Push
          ref: 5bd361b86c048b60b6a8422a8e173ea0ec867bff
          path: target/c0-sources/push
      - uses: actions/checkout@v4
        with:
          repository: SisyphusAeolides/Granite
          ref: c4c36daa40ed79a81751b00dcc4cb6eb4f4d9ac5
          path: target/c0-sources/granite
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential chezscheme gfortran libgmp-dev xz-utils curl
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt,rust-src
          targets: x86_64-unknown-uefi
      - uses: actions/cache@v4
        with:
          path: target/formal/toolchains
          key: arach-formal-idris2-0.8.0-agda-2.8.0-v1
      - run: scripts/bootstrap-formal-toolchains.sh
      - name: Apply generation-aware Linux poll readiness
        run: python3 scripts/patch-linux-poll-readiness.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Build measured C0 bundle
        run: scripts/build-c0-bundle.sh
        env:
          ARACH_PUSH_ROOT: ${{ github.workspace }}/target/c0-sources/push
          ARACH_GRANITE_ROOT: ${{ github.workspace }}/target/c0-sources/granite
      - run: git diff --check
      - name: Verify source-only patch scope
        run: test "$(git diff --name-only | tr '\n' ' ')" = "src/syscalls.rs "
      - name: Publish validated syscall fix
        run: |
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add src/syscalls.rs
          git commit -m "Restore Linux poll readiness"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
