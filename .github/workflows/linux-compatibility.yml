name: Linux compatibility contract

on:
  push:
    paths:
      - src/process/abi.rs
      - src/syscalls.rs
      - scripts/audit_linux_syscalls.py
      - tests/test_linux_syscall_audit.py
      - .github/workflows/linux-compatibility.yml
  pull_request:
    paths:
      - src/process/abi.rs
      - src/syscalls.rs
      - scripts/audit_linux_syscalls.py
      - tests/test_linux_syscall_audit.py
      - .github/workflows/linux-compatibility.yml

permissions:
  contents: read

jobs:
  syscall-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Audit Linux syscall routes
        run: python3 scripts/audit_linux_syscalls.py --root . --report target/linux-x86_64-syscalls.json
      - name: Test audit invariants
        run: python3 -m unittest tests/test_linux_syscall_audit.py
      - name: Upload syscall contract
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-64-syscall-contract-${{ github.sha }}
          path: target/linux-x86_64-syscalls.json
          if-no-files-found: error
      - name: Check repository whitespace
        run: git diff --check
