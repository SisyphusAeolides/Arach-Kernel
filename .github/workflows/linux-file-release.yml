name: Linux file syscall release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt,clippy,rust-src
      - name: Apply Linux file syscall integration
        run: |
          if grep -Fq 'pub mod linux_file;' src/lib.rs; then
            printf 'Linux file syscall integration is already published\n'
          else
            python3 scripts/fix-linux-file-patch.py
            python3 scripts/patch-linux-file-syscalls.py
            python3 scripts/fix-linux-file-tests.py
          fi
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - name: Reject new strict clippy diagnostics
        run: |
          set +e
          mkdir -p target
          cargo clippy --workspace --all-targets --message-format=json -- -D warnings \
            >target/branch-clippy.json 2>target/branch-clippy.stderr
          branch_status=$?
          main_worktree="$RUNNER_TEMP/arach-kernel-main"
          rm -rf "$main_worktree"
          git worktree add --detach "$main_worktree" origin/main
          (
            cd "$main_worktree"
            cargo clippy --workspace --all-targets --message-format=json -- -D warnings \
              >"$RUNNER_TEMP/main-clippy.json" 2>"$RUNNER_TEMP/main-clippy.stderr"
          )
          main_status=$?
          set -e
          BRANCH_STATUS="$branch_status" MAIN_STATUS="$main_status" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def diagnostics(path: Path):
              found = set()
              for raw in path.read_text(errors="replace").splitlines():
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if event.get("reason") != "compiler-message":
                      continue
                  message = event.get("message", {})
                  if message.get("level") != "error":
                      continue
                  code = (message.get("code") or {}).get("code") or "compiler"
                  text = " ".join(str(message.get("message", "")).split())
                  spans = [span for span in message.get("spans", []) if span.get("is_primary")]
                  filename = spans[0].get("file_name", "<unknown>") if spans else "<unknown>"
                  found.add((filename, code, text))
              return found

          branch = diagnostics(Path("target/branch-clippy.json"))
          main = diagnostics(Path(os.environ["RUNNER_TEMP"]) / "main-clippy.json")
          introduced = sorted(branch - main)
          print(f"main strict diagnostics: {len(main)}")
          print(f"branch strict diagnostics: {len(branch)}")
          print(f"new strict diagnostics: {len(introduced)}")
          for filename, code, message in introduced:
              print(f"{filename}: {code}: {message}")
          if introduced:
              raise SystemExit("Linux file bridge introduces new strict clippy diagnostics")
          if os.environ["MAIN_STATUS"] == "0" and os.environ["BRANCH_STATUS"] != "0":
              raise SystemExit("branch failed strict clippy while main passed")
          PY
      - run: cargo test --workspace --all-targets
      - run: git diff --check
      - name: Verify production-only patch scope
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "src/akashic_vfs.rs",
              "src/lib.rs",
              "src/linux_eventfd.rs",
              "src/linux_file.rs",
              "src/syscalls.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected generated changes: {sorted(unexpected)}")
          PY
      - name: Publish validated kernel files
        run: |
          if test -z "$(git diff --name-only)"; then
            exit 0
          fi
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add src/akashic_vfs.rs src/lib.rs src/linux_eventfd.rs \
            src/linux_file.rs src/syscalls.rs
          git commit -m "Add Linux file syscall bridge"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
