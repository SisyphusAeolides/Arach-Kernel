name: Linux file syscall release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt,clippy,rust-src
      - name: Apply Linux file syscall integration
        run: |
          if grep -Fq 'pub mod linux_file;' src/lib.rs; then
            printf 'Linux file syscall integration is already published\n'
          else
            python3 scripts/fix-linux-file-patch.py
            python3 scripts/patch-linux-file-syscalls.py
            python3 scripts/patch-workspace-clippy.py
            python3 scripts/patch-msrv-atomic.py
            python3 scripts/patch-driver-abi-clippy.py
            python3 scripts/patch-driver-test-clippy.py
          fi
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - name: Probe mechanical clippy repairs
        run: |
          set +e
          mkdir -p target
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings \
            >target/clippy-fix.log 2>&1
          fix_status=$?
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings \
            >target/strict-clippy.log 2>&1
          strict_status=$?
          printf '%s\n' '--- files changed by validated patches and clippy fixes ---'
          git diff --name-only
          printf '%s\n' '--- remaining strict clippy diagnostics ---'
          python3 - <<'PY'
          import re
          from pathlib import Path

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          lines = [ansi.sub("", line) for line in Path("target/strict-clippy.log").read_text(errors="replace").splitlines()]
          selected = []
          for index, line in enumerate(lines):
              if line.startswith("error") or "--> " in line or "could not compile" in line:
                  selected.extend(lines[max(0, index - 1):min(len(lines), index + 5)])
          compact = []
          for line in selected:
              if not compact or compact[-1] != line:
                  compact.append(line)
          print("\n".join(compact[-320:]))
          PY
          printf 'clippy-fix status=%s strict status=%s\n' "$fix_status" "$strict_status"
          exit "$strict_status"
      - run: cargo test --workspace --all-targets
      - run: git diff --check
      - name: Verify production-only patch scope
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "build.rs",
              "core/aether/src/resonance_split.rs",
              "libraries/driver-abi/src/prometheus.rs",
              "libraries/slope/src/executor.rs",
              "libraries/slope/src/fabric.rs",
              "libraries/slope/src/hypermedia.rs",
              "libraries/slope/src/lib.rs",
              "libraries/slope/src/memory/mod.rs",
              "libraries/slope/src/signal.rs",
              "src/akashic_vfs.rs",
              "src/lib.rs",
              "src/linux_eventfd.rs",
              "src/linux_file.rs",
              "src/syscalls.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected generated changes: {sorted(unexpected)}")
          PY
      - name: Publish validated kernel files
        run: |
          if test -z "$(git diff --name-only)"; then
            exit 0
          fi
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add build.rs core/aether/src/resonance_split.rs \
            libraries/driver-abi/src/prometheus.rs \
            libraries/slope/src/executor.rs libraries/slope/src/fabric.rs \
            libraries/slope/src/hypermedia.rs libraries/slope/src/lib.rs \
            libraries/slope/src/memory/mod.rs libraries/slope/src/signal.rs \
            src/akashic_vfs.rs src/lib.rs src/linux_eventfd.rs \
            src/linux_file.rs src/syscalls.rs
          git commit -m "Add Linux file syscall bridge"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
