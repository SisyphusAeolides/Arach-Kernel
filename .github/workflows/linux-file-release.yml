name: Linux file syscall release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt,clippy,rust-src
      - name: Apply Linux file syscall integration
        run: |
          if grep -Fq 'pub mod linux_file;' src/lib.rs; then
            printf 'Linux file syscall integration is already published\n'
          else
            python3 scripts/fix-linux-file-patch.py
            python3 scripts/patch-linux-file-syscalls.py
            python3 scripts/patch-workspace-clippy.py
            python3 scripts/patch-msrv-atomic.py
            python3 scripts/patch-driver-abi-clippy.py
          fi
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: git diff --check
      - name: Verify production-only patch scope
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "build.rs",
              "core/aether/src/resonance_split.rs",
              "libraries/driver-abi/src/prometheus.rs",
              "libraries/slope/src/executor.rs",
              "libraries/slope/src/fabric.rs",
              "libraries/slope/src/hypermedia.rs",
              "libraries/slope/src/lib.rs",
              "libraries/slope/src/memory/mod.rs",
              "libraries/slope/src/signal.rs",
              "src/akashic_vfs.rs",
              "src/lib.rs",
              "src/linux_eventfd.rs",
              "src/linux_file.rs",
              "src/syscalls.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected generated changes: {sorted(unexpected)}")
          PY
      - name: Publish validated kernel files
        run: |
          if test -z "$(git diff --name-only)"; then
            exit 0
          fi
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add build.rs core/aether/src/resonance_split.rs \
            libraries/driver-abi/src/prometheus.rs \
            libraries/slope/src/executor.rs libraries/slope/src/fabric.rs \
            libraries/slope/src/hypermedia.rs libraries/slope/src/lib.rs \
            libraries/slope/src/memory/mod.rs libraries/slope/src/signal.rs \
            src/akashic_vfs.rs src/lib.rs src/linux_eventfd.rs \
            src/linux_file.rs src/syscalls.rs
          git commit -m "Add Linux file syscall bridge"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
